name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  check:
    name: Exact-head check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CI_HEAD_SHA }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
      - name: Run repository checks
        run: npm run check

  packaged-e2e:
    name: Exact-head packaged macOS E2E
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Checkout exact head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.CI_HEAD_SHA }}
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify exact head
        run: test "$(git rev-parse HEAD)" = "$CI_HEAD_SHA"
      - name: Run packaged application evidence
        run: npm run test:e2e
